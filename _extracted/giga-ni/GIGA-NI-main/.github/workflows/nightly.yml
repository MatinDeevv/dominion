name: Nightly Regression Tests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backtest-regression:
    name: Backtest Regression Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,ml,tui]"
          pip install pytorch-lightning loguru

      - name: Run backtest regression suite
        run: |
          pytest tests/backtest/ -v --tb=short

      - name: Write regression snapshot
        run: |
          python scripts/compare_backtest_results.py \
            --baseline tests/fixtures/backtest_baseline.json \
            --current tests/fixtures/backtest_baseline.json \
            --tolerance 5

  performance-check:
    name: Inference Latency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,ml,tui]"
          pip install pytorch-lightning loguru

      - name: Check inference latency
        run: |
          python scripts/benchmark_inference.py --samples 1000 --output latency_report.txt
          python - <<'PY'
          from pathlib import Path
          report = Path("latency_report.txt").read_text(encoding="utf-8").splitlines()
          avg_line = next(line for line in report if line.startswith("Average latency:"))
          value = float(avg_line.split(":", 1)[1].strip().removesuffix("ms"))
          if value > 50.0:
              raise SystemExit(f"Inference latency too high: {value:.2f}ms")
          print(f"Inference latency OK: {value:.2f}ms")
          PY

      - name: Upload latency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-report
          path: latency_report.txt
