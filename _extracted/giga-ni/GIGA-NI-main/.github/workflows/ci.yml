name: CI Tests & Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,ml,tui]"
          pip install pyright ruff pytorch-lightning loguru

      - name: Run unit tests with coverage
        run: |
          pytest tests/ machinelearning/tests/ -v --tb=short \
            --cov=aphelion --cov=machinelearning --cov=mt5pipe \
            --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

  type-check:
    name: Type Checking (pyright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,ml,tui]"
          pip install pyright pytorch-lightning loguru

      - name: Run pyright
        run: |
          pyright aphelion/ machinelearning/ mt5pipe/ --level=basic

  lint:
    name: Linting (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: |
          ruff check aphelion/ machinelearning/ mt5pipe/ tests/

      - name: Run ruff format check
        run: |
          ruff format --check aphelion/ machinelearning/ mt5pipe/ tests/

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for executable print() calls in aphelion/
        run: |
          python - <<'PY'
          import ast
          import pathlib
          offenders = []
          for path in pathlib.Path("aphelion").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == "print":
                      offenders.append(f"{path}:{node.lineno}")
          if offenders:
              print("Executable print() calls found:")
              print("\n".join(offenders))
              raise SystemExit(1)
          print("No executable print() calls found in aphelion/.")
          PY

      - name: Check for bare except clauses
        run: |
          BARE=$(grep -R "except:" aphelion/ machinelearning/ mt5pipe/ --include="*.py" | wc -l)
          if [ "$BARE" -gt 0 ]; then
            echo "Found bare except clauses"
            exit 1
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, type-check, lint, code-quality]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "Type checking failed"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Linting failed"
            exit 1
          fi
          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "Code quality checks failed"
            exit 1
          fi
          echo "All CI checks passed"
