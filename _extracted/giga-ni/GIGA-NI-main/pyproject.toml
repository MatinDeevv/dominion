[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aphelion"
version = "0.1.0"
description = "Unified APHELION AI trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "polars>=1.0.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "psutil>=5.9.0",
    "pyarrow>=23.0.1",
    "tzdata>=2024.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer[all]>=0.9.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "PyYAML>=6.0",
    "rich>=13.0.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "optuna>=3.0",
    "shap>=0.43",
]
broker = [
    "MetaTrader5>=5.0.45",
    "python-dotenv>=1.0",
]
tui = [
    "textual>=0.47",
    "plotext>=5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
]
all = ["aphelion[ml,broker,tui,dev]"]

[project.scripts]
aphelion = "aphelion.__main__:main"
aphelion-demo = "aphelion.paper.launchers:run_demo_main"
aphelion-paper = "aphelion.paper.launchers:run_paper_main"
aphelion-tui = "aphelion.tui.launcher:main"
mt5pipe = "mt5pipe.cli.app:app"
mt5pipe-super = "mt5pipe.tools.super_pipeline_tui:main"
aphelion-mt5pipe-replay = "aphelion.feature_engine.integrations.mt5pipe:main"

[tool.setuptools.packages.find]
include = ["aphelion*", "mt5pipe*", "machinelearning*"]
