[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aphelion-feature-engine"
version = "0.1.0"
description = "Journal-first, replay-safe feature engine for event-driven XAUUSD trading."
readme = "FEATURE_ENGINE_DESIGN.md"
requires-python = ">=3.12"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
mt5pipe = [
  "pyarrow>=23.0.1",
  "PyYAML>=6.0.3",
]

[project.scripts]
aphelion-mt5pipe-replay = "aphelion.feature_engine.integrations.mt5pipe:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
