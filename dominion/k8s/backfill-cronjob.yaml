apiVersion: batch/v1
kind: CronJob
metadata:
  name: dominion-backfill
  namespace: dominion
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backfill
              image: dominion:latest
              command: ["mt5pipe"]
              args: ["backfill", "--symbol", "XAUUSD", "--window", "1d"]
              envFrom:
                - configMapRef:
                    name: dominion-config
                - secretRef:
                    name: dominion-secrets
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
              volumeMounts:
                - name: data
                  mountPath: /app/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: dominion-data
