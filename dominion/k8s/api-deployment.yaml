apiVersion: apps/v1
kind: Deployment
metadata:
  name: dominion-api
  namespace: dominion
  labels:
    app: dominion-api
    role: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dominion-api
  template:
    metadata:
      labels:
        app: dominion-api
    spec:
      containers:
        - name: api
          image: dominion:latest
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "aphelion"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dominion-config
            - secretRef:
                name: dominion-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: strategy
              mountPath: /app/config/strategies
      volumes:
        - name: strategy
          configMap:
            name: dominion-strategy
---
apiVersion: v1
kind: Service
metadata:
  name: dominion-api
  namespace: dominion
spec:
  type: ClusterIP
  selector:
    app: dominion-api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
