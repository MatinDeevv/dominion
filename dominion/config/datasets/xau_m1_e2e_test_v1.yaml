schema_version: "1.0.0"
dataset_name: "xau_m1_e2e_test"
version: "1.0.0"
description: "E2E test: 1 month XAUUSD M1, all 8 feature families, dual-broker canonical, trust-gated."
symbols:
  - "XAUUSD"
date_from: "2026-03-14"
date_to: "2026-04-14"
base_clock: "M1"
state_version_ref: "state.default@1.0.0"
feature_selectors:
  - "time/*"
  - "session/*"
  - "quality/*"
  - "htf_context/*"
  - "disagreement/*"
  - "event_shape/*"
  - "entropy/*"
  - "multiscale/*"
label_pack_ref: "core_tb_volscaled@1.0.0"
required_raw_brokers:
  - "broker_a"
  - "broker_b"
require_synchronized_raw_coverage: true
require_dual_source_overlap: true
min_dual_source_ratio: 0.10
filters:
  - "exclude:filled_rows"
split_policy: "temporal_holdout"
train_ratio: 0.70
val_ratio: 0.15
test_ratio: 0.15
embargo_rows: 240
truth_policy_ref: "truth.default@1.0.0"
publish_on_accept: true
tags:
  - "e2e-test"
  - "xau"
  - "full-pipeline"
