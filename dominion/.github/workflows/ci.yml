name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff mypy
      - name: Ruff check
        run: ruff check aphelion mt5pipe machinelearning scripts
      - name: Ruff format check
        run: ruff format --check aphelion mt5pipe machinelearning scripts
      - name: Mypy (soft — non-blocking until coverage raised)
        run: mypy aphelion/core aphelion/feature_engine aphelion/inference || true

  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install deps (no MetaTrader5 on Linux)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,tui,dev]"
      - name: Run tests with coverage
        run: |
          pytest tests/ machinelearning/tests/ \
            --ignore=tests/tui \
            --cov=aphelion --cov=mt5pipe --cov=machinelearning \
            --cov-report=xml --cov-report=term \
            -x -q
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dominion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
